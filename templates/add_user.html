<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu de administração · BIC3TAB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="shell narrow">
      <header class="topbar">
        <a class="brand brand-link" href="{{ url_for('bic3tab') }}"><img src="{{ url_for('static', filename='dpd_logo_50.png') }}" alt="DPD" style="height:48px;width:auto" /></a>
        <a class="quiet" href="{{ url_for('admin_menu') }}">Voltar à administração</a>
      </header>
      <section class="panel login-panel">
        <p class="eyebrow">ADMINISTRAÇÃO</p><h2>Criar utilizador</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
        <form method="post" autocomplete="off" action="{{ url_for('add_user') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <label for="name">Nome</label><input id="name" name="name" maxlength="255" required autofocus />
          <label for="username">Email DPD</label><input id="username" name="username" type="email" maxlength="320" autocomplete="off" required />
          <label for="isAdmin">Permissões de administrador</label><select id="isAdmin" name="isAdmin"><option value="0" selected>Utilizador normal</option><option value="1">Administrador</option></select>
          <label for="isActive">Estado da conta</label><select id="isActive" name="isActive"><option value="1" selected>Ativa</option><option value="0">Inativa</option></select>
          <p class="hint">Será enviado um email com uma ligação de utilização única para definir a palavra-passe.</p>
          <button type="submit" class="primary full">Criar utilizador <span aria-hidden="true">→</span></button>
        </form>
      </section>
    </main>
  </body>
</html>

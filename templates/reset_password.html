<!doctype html>
<html lang="pt">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Definir palavra-passe · BIC3TAB</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" /></head>
  <body><main class="shell narrow"><header class="topbar"><div class="brand"><img src="{{ url_for('static', filename='dpd_logo_50.png') }}" alt="DPD" style="height:48px;width:auto" /></div></header>
    <section class="panel login-panel"><p class="eyebrow">BIC3TAB</p><h2>Definir palavra-passe</h2><p class="muted">Escolha uma palavra-passe com pelo menos 12 caracteres.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
      <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}" /><label for="password">Nova palavra-passe</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required autofocus /><label for="password_confirmation">Confirmar palavra-passe</label><input id="password_confirmation" name="password_confirmation" type="password" minlength="12" autocomplete="new-password" required /><button type="submit" class="primary full">Guardar palavra-passe</button></form>
    </section></main></body>
</html>
